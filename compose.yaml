name: sugarguard-carebridge

# Local development only. The Next.js app runs on the host with pnpm dev.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sugarguard
      POSTGRES_USER: sugarguard
      POSTGRES_PASSWORD: "qxVL5vG9wDXSAgblb8gbJAoCklw+b6MmENc3B5Op9+0="
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugarguard -d sugarguard"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/qxVL5vG9wDXSAgblb8gbJAoCklw+b6MmENc3B5Op9+0="
      HEALTHCHECK_PASSWORD: "qxVL5vG9wDXSAgblb8gbJAoCklw+b6MmENc3B5Op9+0="
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$$HEALTHCHECK_PASSWORD" "RETURN 1;"',
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
